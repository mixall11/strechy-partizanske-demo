<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}
.banner{width:1200px;height:628px;font-family:'Inter',sans-serif;overflow:hidden;position:relative;background:#1c2127}
.metal{position:absolute;inset:0;background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/26px 26px,
 radial-gradient(circle at 50% 50%,rgba(0,0,0,.32) 0 3px,transparent 4px) 13px 13px/26px 26px,
 linear-gradient(140deg,#7e848a,#474c52)}
.panel{position:absolute;inset:0;background:#d39a17;clip-path:polygon(0 0,62% 0,46% 100%,0 100%)}
.panel::after{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.18),transparent 50%)}
.inner{position:absolute;inset:0;padding:52px 54px 44px;display:flex;flex-direction:column;color:#1c2127}
.brand{font-size:17px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#1c2127}
.brand::after{content:'';display:inline-block;width:44px;height:3px;background:#1c2127;margin-left:13px;vertical-align:middle;opacity:.6}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;align-self:flex-start;background:#1c2127;color:#ffd97a;font-weight:800;font-size:14.5px;padding:8px 16px;border-radius:30px}
.pill::before{content:'';width:9px;height:9px;border-radius:50%;background:#ffd97a}
h1{font-size:58px;font-weight:900;line-height:1.0;letter-spacing:-1px;margin-top:18px;color:#1c2127}
h1 .hi{color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.18)}
.sub{font-size:20px;font-weight:700;color:#2b2017;line-height:1.3;margin-top:15px;max-width:430px}
.cta{margin-top:auto;display:flex;align-items:center;gap:20px}
.btn{background:#1c2127;color:#fff;font-size:20px;font-weight:800;padding:16px 28px;border-radius:11px}
.contact{font-size:14.5px;font-weight:800;color:#1c2127;line-height:1.5}
.badge{position:absolute;right:60px;top:50%;transform:translateY(-50%) rotate(4deg);background:#1c2127;color:#fff;font-weight:900;font-size:16px;letter-spacing:.1em;text-transform:uppercase;padding:12px 20px;border-radius:10px;text-align:center;line-height:1.25;box-shadow:0 12px 28px -8px rgba(0,0,0,.5)}
.badge small{display:block;font-size:12px;opacity:.8;font-weight:800;margin-top:3px}
</style></head><body>
<div class="banner">
 <div class="metal"></div>
 <div class="panel"></div>
 <div class="badge">Ochrana<br>proti kunám<small>perforovaný plech skladom</small></div>
 <div class="inner">
  <div class="brand">Strechy Partizánske</div>
  <div class="pill">Skladom v Partizánskom</div>
  <h1>Kuny ti ničia <span class="hi">strechu?</span></h1>
  <p class="sub">Ochranná mriežka proti kunám — chráni izoláciu, kabeláž aj odkvapy.</p>
  <div class="cta"><span class="btn">Perforovaný plech skladom →</span>
   <span class="contact">strechy-partizanske.sk<br>📞 +421 915 589 009</span></div>
 </div>
</div></body></html>
