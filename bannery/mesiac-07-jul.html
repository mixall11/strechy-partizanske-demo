<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}
.banner{width:1200px;height:628px;background:#fff;font-family:'Inter',sans-serif;display:flex;overflow:hidden}
.left{flex:1.55;padding:50px 48px 42px;display:flex;flex-direction:column}
.brand{font-size:17px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#b07f0f}
.brand::after{content:'';display:inline-block;width:46px;height:3px;background:#d39a17;margin-left:14px;vertical-align:middle}
.stockpill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;align-self:flex-start;background:#eaf6ee;color:#2f7d4f;font-weight:800;font-size:15px;padding:8px 16px;border-radius:30px}
.stockpill::before{content:'';width:10px;height:10px;border-radius:50%;background:#2f7d4f}
h1{font-size:62px;font-weight:900;color:#1c2127;line-height:1.0;letter-spacing:-1px;margin-top:18px}
h1 .hi{color:#b07f0f}
.sub{font-size:21px;font-weight:600;color:#3a4049;line-height:1.32;margin-top:18px;max-width:560px}
.cta{margin-top:auto;display:flex;align-items:center;gap:20px}
.btn{background:#1c2127;color:#fff;font-size:20px;font-weight:800;padding:16px 28px;border-radius:11px}
.contact{font-size:15px;font-weight:700;color:#596066;line-height:1.5}.contact b{color:#1c2127}
.right{flex:.92;position:relative;background:linear-gradient(150deg,#d39a17,#b07f0f);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;overflow:hidden}
.right::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.18),transparent 55%)}
.ico{font-size:96px;line-height:1;position:relative;filter:drop-shadow(0 6px 12px rgba(0,0,0,.22))}
.mon{position:relative;font-size:40px;font-weight:900;letter-spacing:-.5px;margin-top:6px}
.seas{position:relative;margin-top:12px;font-size:14px;font-weight:900;letter-spacing:.16em;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.55);padding:7px 16px;border-radius:30px}
</style></head><body>
<div class="banner">
 <div class="left">
  <div class="brand">Strechy Partizánske</div>
  <div class="stockpill">Skladom v Partizánskom</div>
  <h1>Robíš <span class="hi">strechu?</span></h1>
  <p class="sub">Oplechovania, úžľabia a lemovanie komína — skladom aj na mieru.</p>
  <div class="cta">
   <span class="btn">Pozri klampiarske →</span>
   <span class="contact"><b>strechy-partizanske.sk</b><br>📞 +421 915 589 009</span>
  </div>
 </div>
 <div class="right">
  <div class="ico">☀️</div>
  <div class="mon">JÚL</div>
  <div class="seas">LETO</div>
 </div>
</div></body></html>
