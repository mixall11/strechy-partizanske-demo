<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}
.banner{width:1200px;height:628px;font-family:'Inter',sans-serif;display:flex;overflow:hidden}
.left{flex:1.05;background:#1c2127;color:#fff;padding:52px 46px 44px;display:flex;flex-direction:column}
.brand{font-size:16px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#e6b53f}
.brand::after{content:'';display:inline-block;width:42px;height:3px;background:#d39a17;margin-left:12px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;align-self:flex-start;background:rgba(47,125,79,.22);border:1.5px solid #57b07d;color:#9fe3bb;font-weight:800;font-size:14.5px;padding:7px 15px;border-radius:30px}
.pill::before{content:'';width:9px;height:9px;border-radius:50%;background:#57b07d}
h1{font-size:55px;font-weight:900;line-height:1.02;letter-spacing:-1px;margin-top:18px}
h1 .hi{color:#e6b53f}
.sub{font-size:19px;font-weight:600;color:#cfd3d8;line-height:1.34;margin-top:16px}
.cta{margin-top:auto}
.btn{display:inline-block;background:#d39a17;color:#1c2127;font-size:19px;font-weight:900;padding:15px 26px;border-radius:11px}
.contact{font-size:14px;font-weight:700;color:#aeb4ba;line-height:1.5;margin-top:16px}.contact b{color:#fff}
.right{flex:1;position:relative;background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.13) 0 2.4px,transparent 3.4px) 0 0/30px 30px,
 radial-gradient(circle at 50% 50%,rgba(0,0,0,.34) 0 3.4px,transparent 4.4px) 15px 15px/30px 30px,
 linear-gradient(125deg,#8a9097,#454b52 70%);overflow:hidden}
.right::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.25),transparent 40%)}
.tag{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-5deg);background:#d39a17;color:#1c2127;font-weight:900;font-size:18px;letter-spacing:.06em;text-transform:uppercase;padding:14px 24px;border-radius:10px;box-shadow:0 12px 28px -8px rgba(0,0,0,.5);text-align:center;line-height:1.2}
.tag small{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;opacity:.85;margin-top:3px}
</style></head><body>
<div class="banner">
 <div class="left">
  <div class="brand">Strechy Partizánske</div>
  <div class="pill">Skladom v Partizánskom</div>
  <h1>Kuny ti ničia <span class="hi">strechu?</span></h1>
  <p class="sub">Perforovaný plech — ochranná mriežka proti kunám. Zabráň škodám na izolácii, kabeláži aj odkvapoch.</p>
  <div class="cta"><span class="btn">Perforovaný plech skladom →</span>
   <div class="contact"><b>strechy-partizanske.sk</b> · 📞 +421 915 589 009</div></div>
 </div>
 <div class="right"><div class="tag">Perforovaný plech<small>pozinkovaný · skladom</small></div></div>
</div></body></html>
