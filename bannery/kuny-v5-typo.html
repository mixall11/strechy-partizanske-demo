<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}
.banner{width:1200px;height:628px;font-family:'Inter',sans-serif;overflow:hidden;position:relative;color:#fff;
 background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 2px,transparent 3px) 0 0/26px 26px,
 radial-gradient(circle at 50% 50%,rgba(0,0,0,.42) 0 3px,transparent 4px) 13px 13px/26px 26px,
 linear-gradient(160deg,#4f545a,#23272c)}
.banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(28,33,39,.30),rgba(15,17,20,.86))}
.inner{position:relative;height:100%;padding:46px 56px;display:flex;flex-direction:column;align-items:center;text-align:center}
.brand{font-size:16px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#e6b53f}
.pill{margin-top:14px;background:rgba(47,125,79,.2);border:1.5px solid #57b07d;color:#9fe3bb;font-weight:800;font-size:14px;padding:6px 15px;border-radius:30px}
h1{font-size:80px;font-weight:900;line-height:.98;letter-spacing:-2px;margin-top:auto;text-shadow:0 4px 16px rgba(0,0,0,.55)}
h1 .hi{color:#e6b53f}
.sub{font-size:20px;font-weight:600;color:#d6dade;line-height:1.34;margin-top:18px;max-width:680px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.btn{margin-top:24px;background:#d39a17;color:#1c2127;font-size:22px;font-weight:900;padding:18px 34px;border-radius:12px;box-shadow:0 10px 24px -6px rgba(211,154,23,.55)}
.contact{margin-top:auto;font-size:15px;font-weight:700;color:#c3c8cd}.contact b{color:#fff}
</style></head><body>
<div class="banner"><div class="inner">
 <div class="brand">Strechy Partizánske</div>
 <div class="pill">Skladom v Partizánskom</div>
 <h1>Stop kunám <span class="hi">na streche.</span></h1>
 <p class="sub">Perforovaný plech — ochranná mriežka proti kunám. Zabráň škodám na izolácii, kabeláži aj odkvapoch.</p>
 <span class="btn">Perforovaný plech skladom →</span>
 <div class="contact"><b>strechy-partizanske.sk</b> · 📞 +421 915 589 009</div>
</div></body></html>
