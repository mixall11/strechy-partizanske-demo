<?xml version="1.0" encoding="UTF-8"?>
<!--
  Strechy Partizánske — print banner 2 × 2 m (štvorec)
  Units: millimetres. viewBox = 2000 × 2000 mm.
  Font: Inter (https://fonts.google.com/specimen/Inter)
  V Illustratore: Type → Create Outlines (Shift+Ctrl+O) ak chceš font ponechať bez závislosti.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2000 2000"
     width="2000mm" height="2000mm"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
     shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision">

  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0a3578"/>
    </linearGradient>
  </defs>

  <!-- ===== Banner background ===== -->
  <rect x="0" y="0" width="2000" height="2000" fill="#ffffff"/>

  <!-- ===== HEADER STRIP (top 280mm) — biele pre transparentný logo ===== -->
  <rect x="0" y="0" width="2000" height="276" fill="#ffffff"/>
  <rect x="0" y="276" width="2000" height="4" fill="#EE1C23"/>

  <!-- Real brand logo (loaded from strechy-partizanske.sk; transparent bg) -->
  <image x="80" y="40" width="380" height="220"
         href="https://strechy-partizanske.sk/assets/img/SP3_bez_pozadia.svg"
         xlink:href="https://strechy-partizanske.sk/assets/img/SP3_bez_pozadia.svg"/>

  <!-- Brand name (dark, vedľa loga) -->
  <text x="500" y="175" fill="#15191f" font-weight="900" font-size="90" letter-spacing="2">STRECHY PARTIZÁNSKE</text>

  <!-- Brand tag -->
  <text x="500" y="225" fill="#4a5560" font-weight="800" font-size="30" letter-spacing="6">OD 2012 · KRYTINY · KLAMPIARSTVO · MONTÁŽ</text>

  <!-- ===== HERO — Euromat odkvap (280–1040mm = 38%) ===== -->
  <!-- Eyebrow pill -->
  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="700" height="74" rx="37" fill="#FBC02D"/>
    <circle cx="42" cy="37" r="14" fill="#15191f"/>
    <text x="68" y="51" fill="#15191f" font-weight="900" font-size="28" letter-spacing="5">SKLADOM · IHNEĎ K ODBERU</text>
  </g>

  <!-- Main headline -->
  <text x="120" y="630" fill="#15191f" font-weight="900" font-size="150" letter-spacing="-4">Odkvapový systém</text>
  <text x="120" y="830" fill="#EE1C23" font-weight="900" font-size="260" letter-spacing="-9">EUROMAT</text>

  <!-- Sub -->
  <text x="120" y="940" fill="#4a5560" font-weight="600" font-size="44">Kompletný pozinkovaný + farebný systém</text>
  <text x="120" y="995" fill="#4a5560" font-weight="600" font-size="44">pre rodinné domy. Dovoz po okolí zdarma.</text>

  <!-- ===== SIDE — Modulové krytiny (1040–1640mm = 30%) ===== -->
  <rect x="0" y="1040" width="2000" height="600" fill="url(#blueGrad)"/>

  <!-- Left part of side: title -->
  <text x="120" y="1140" fill="#FBC02D" font-weight="800" font-size="32" letter-spacing="7">AJ NA MIERU</text>
  <text x="120" y="1290" fill="#ffffff" font-weight="900" font-size="140" letter-spacing="-4">Modulové</text>
  <text x="120" y="1430" fill="#ffffff" font-weight="900" font-size="140" letter-spacing="-4">krytiny</text>

  <!-- Right part of side: checkmark list (4 items) -->
  <g font-weight="700" fill="#ffffff" font-size="46">
    <g transform="translate(1100, 1150)">
      <circle cx="32" cy="20" r="32" fill="#EE1C23"/>
      <text x="22" y="33" font-size="36" font-weight="900">✓</text>
      <text x="85" y="38">Skladom 12 farieb RAL</text>
    </g>
    <g transform="translate(1100, 1250)">
      <circle cx="32" cy="20" r="32" fill="#EE1C23"/>
      <text x="22" y="33" font-size="36" font-weight="900">✓</text>
      <text x="85" y="38">Objednávka na rozmer</text>
    </g>
    <g transform="translate(1100, 1350)">
      <circle cx="32" cy="20" r="32" fill="#EE1C23"/>
      <text x="22" y="33" font-size="36" font-weight="900">✓</text>
      <text x="85" y="38">Dodanie do 5 dní</text>
    </g>
    <g transform="translate(1100, 1450)">
      <circle cx="32" cy="20" r="32" fill="#EE1C23"/>
      <text x="22" y="33" font-size="36" font-weight="900">✓</text>
      <text x="85" y="38">30 rokov záruka</text>
    </g>
  </g>

  <!-- ===== CONTACT STRIP (bottom 360mm = 18%) ===== -->
  <rect x="0" y="1640" width="2000" height="360" fill="#15191f"/>

  <!-- Phone — red circle + huge number -->
  <g transform="translate(120, 1700)">
    <circle cx="80" cy="80" r="80" fill="#EE1C23"/>
    <text x="80" y="106" text-anchor="middle" font-size="92" fill="#ffffff">📞</text>
  </g>
  <text x="310" y="1810" fill="#ffffff" font-weight="900" font-size="120" letter-spacing="-3">+421 915 589 009</text>

  <!-- Address (under phone, bigger) -->
  <text x="310" y="1885" fill="#FBC02D" font-weight="800" font-size="34" letter-spacing="6">PREVÁDZKA</text>
  <text x="310" y="1945" fill="#ffffff" font-weight="900" font-size="52">Víťazná 181/10 · 958 04 Partizánske</text>

  <!-- Web (right side, separated by line) — bigger -->
  <line x1="1380" y1="1690" x2="1380" y2="1960" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <text x="1960" y="1820" text-anchor="end" fill="#FBC02D" font-weight="900" font-size="90" letter-spacing="-2">strechy-partizanske.sk</text>
  <text x="1960" y="1875" text-anchor="end" fill="rgba(255,255,255,0.78)" font-weight="700" font-size="34" letter-spacing="5">ONLINE CENOVÁ PONUKA</text>

</svg>
