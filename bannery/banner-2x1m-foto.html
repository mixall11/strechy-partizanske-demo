<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>Baner 2×1 m — foto · EVROMAT + REGAMET | Strechy Partizánske</title>
<meta name="description" content="Print-ready baner 2×1 m podľa dizajnu banner-3-3. Strešné krytiny REGAMET, odkvapové systémy EVROMAT, klampiarska výroba na mieru.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap">
<style>
  @page { size: 200cm 100cm; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #2c333a;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }

  /* 2:1 (2 m × 1 m) — preview 1400×700 px */
  .banner {
    width: min(96vw, 1400px);
    aspect-ratio: 2 / 1;
    background:
      radial-gradient(120% 120% at 8% 6%, rgba(255,255,255,.28) 0%, rgba(255,255,255,0) 32%),
      linear-gradient(116deg, #2aa6e4 0%, #0f88d1 40%, #0a69af 72%, #075c9e 100%);
    color: #fff;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
    position: relative;
    container-type: inline-size;
  }

  /* biela vlna pod foto-kolážou */
  .wave {
    position: absolute;
    top: -8%; right: -4%;
    width: 58cqw; height: 56cqw;
    background: #fff;
    opacity: .09;
    border-radius: 0 0 0 100%;
    transform: rotate(-8deg);
    z-index: 1;
  }

  /* foto-koláž vpravo hore (raster z banner-3-3) */
  .collage {
    position: absolute;
    top: 3.5%; right: 0;
    width: 47cqw;
    z-index: 2;
    -webkit-mask:
      linear-gradient(to bottom, #000 78%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 16%);
    -webkit-mask-composite: source-in;
    mask:
      linear-gradient(to bottom, #000 78%, transparent 100%),
      linear-gradient(to right, transparent 0%, #000 16%);
    mask-composite: intersect;
  }
  .collage img { width: 100%; display: block; }

  /* logo na bielom badge vľavo hore */
  .logo-card {
    position: absolute;
    top: 5.5%; left: 3.4cqw;
    background: #fff;
    border-radius: 1.4cqw;
    padding: 1.3cqw 2cqw;
    box-shadow: 0 1cqw 2.6cqw rgba(0,0,0,.25);
    z-index: 4;
  }
  .logo-card img { height: 8.4cqw; width: auto; display: block; }

  /* produkty + značky */
  .bullets {
    position: absolute;
    left: 3.4cqw;
    top: 40%;
    z-index: 5;
    list-style: none;
  }
  .bullets li {
    display: flex;
    align-items: center;
    gap: 1.5cqw;
    line-height: 1.04;
    margin-bottom: 1.9cqw;
  }
  .bullets .dot {
    width: 1.7cqw; height: 1.7cqw;
    background: #EE1C23;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .bullets .name {
    font-weight: 900;
    font-size: 5cqw;
    letter-spacing: -.02em;
    color: #fff;
    text-shadow: 0 .25cqw .6cqw rgba(4,30,60,.35);
    white-space: nowrap;
  }
  .bullets .name.alt { color: #eaf5ff; }

  /* značkový chip pri produkte */
  .chip {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    background: #fff;
    border-radius: .9cqw;
    padding: .6cqw 1.1cqw;
    line-height: 1;
    box-shadow: 0 .5cqw 1.4cqw rgba(0,0,0,.22);
    flex-shrink: 0;
  }
  .chip .wm { font-weight: 900; font-size: 2.05cqw; letter-spacing: .01em; color: #0a3578; }
  .chip .wm b { color: #EE1C23; }
  .chip small {
    font-size: .82cqw; font-weight: 800; letter-spacing: .1em;
    text-transform: uppercase; color: #5a6573; margin-top: .35cqw;
  }

  /* spodný kontaktný pruh */
  .contact {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 11.5cqw;
    background: #075a9c;
    border-top: .35cqw solid rgba(255,255,255,.22);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1cqw;
    padding: 0 3cqw;
    z-index: 6;
    font-weight: 700;
  }
  .contact .item { display: flex; align-items: center; gap: .85cqw; font-size: 1.55cqw; white-space: nowrap; }
  .contact .ico {
    width: 2.7cqw; height: 2.7cqw; flex-shrink: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    font-size: 1.45cqw; font-weight: 900;
  }
  .contact .item.web { font-weight: 900; color: #ffe08a; }
  .contact .sep { width: .16cqw; height: 3.2cqw; background: rgba(255,255,255,.22); flex-shrink: 0; }

  .print-info {
    position: fixed; top: 12px; left: 12px;
    background: rgba(0,0,0,.7); color: #fff;
    padding: 8px 14px; border-radius: 6px;
    font-size: 12px; font-family: monospace; z-index: 99;
  }
  @media print {
    body { background: #fff; padding: 0; }
    .banner { width: 100vw; height: 100vh; box-shadow: none; max-width: none; }
    .print-info { display: none; }
  }
</style>
</head>
<body>

<div class="print-info">📐 2×1 m banner (foto · banner-3-3) · Ctrl+P → Print to PDF · „Print: 200×100 cm"</div>

<div class="banner">

  <span class="wave"></span>

  <div class="collage"><img src="assets/b3-collage.png" alt="Strešné krytiny, modulové krytiny, odkvapové systémy"></div>

  <div class="logo-card">
    <img src="../funnel-v1/logo.svg?v=9" alt="Strechy Partizánske">
  </div>

  <ul class="bullets">
    <li>
      <span class="dot"></span>
      <span class="name">Strešné krytiny</span>
      <span class="chip"><span class="wm">REGA<b>MET</b></span><small>modulové</small></span>
    </li>
    <li>
      <span class="dot"></span>
      <span class="name alt">Odkvapové systémy</span>
      <span class="chip"><span class="wm">EVR<b>O</b>MAT</span><small>odkvapy</small></span>
    </li>
    <li>
      <span class="dot"></span>
      <span class="name">Klampiarska výroba <span style="font-weight:700;font-size:.62em;color:#cfe7fb">na mieru</span></span>
    </li>
  </ul>

  <div class="contact">
    <span class="item"><span class="ico">📍</span>Víťazná 181/10, 958&nbsp;04 Partizánske</span>
    <span class="sep"></span>
    <span class="item"><span class="ico">f</span>Strechy Partizánske</span>
    <span class="sep"></span>
    <span class="item"><span class="ico">📞</span>+421&nbsp;915&nbsp;589&nbsp;009</span>
    <span class="sep"></span>
    <span class="item web">strechy-partizanske.sk</span>
  </div>

</div>

</body>
</html>
