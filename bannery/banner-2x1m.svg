<?xml version="1.0" encoding="UTF-8"?>
<!--
  Strechy Partizánske — print banner 2 × 1 m
  Units: millimetres. viewBox = 2000 × 1000 mm (physical size).
  Font: Inter (https://fonts.google.com/specimen/Inter) — install before opening in Illustrator,
        alebo v Illustratore: Type → Create Outlines (Shift+Ctrl+O) → text sa zmení na krivky.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 2000 1000"
     width="2000mm" height="1000mm"
     font-family="Inter, 'Helvetica Neue', Arial, sans-serif"
     shape-rendering="geometricPrecision"
     text-rendering="geometricPrecision">

  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1565C0"/>
      <stop offset="100%" stop-color="#0a3578"/>
    </linearGradient>
  </defs>

  <!-- ===== Banner background (white) ===== -->
  <rect x="0" y="0" width="2000" height="1000" fill="#ffffff"/>

  <!-- ===== HEADER STRIP (top 140mm) — biele pre transparentný logo ===== -->
  <rect x="0" y="0" width="2000" height="136" fill="#ffffff"/>
  <rect x="0" y="136" width="2000" height="4" fill="#EE1C23"/>

  <!-- Real brand logo (loaded from strechy-partizanske.sk; transparent bg) -->
  <image x="40" y="12" width="220" height="125"
         href="https://strechy-partizanske.sk/assets/img/SP3_bez_pozadia.svg"
         xlink:href="https://strechy-partizanske.sk/assets/img/SP3_bez_pozadia.svg"/>

  <!-- Brand name (dark, vedľa loga) -->
  <text x="290" y="92" fill="#15191f" font-weight="900" font-size="64" letter-spacing="1.5">STRECHY PARTIZÁNSKE</text>

  <!-- Brand tag (right-aligned, smaller, dark) -->
  <text x="1960" y="84" text-anchor="end" fill="#4a5560" font-weight="800" font-size="28" letter-spacing="6">KRYTINY · KLAMPIARSTVO · MONTÁŽ</text>

  <!-- ===== HERO (left 58%) — Euromat odkvap ===== -->
  <!-- Eyebrow pill — SKLADOM · IHNEĎ K ODBERU -->
  <g transform="translate(70, 230)">
    <rect x="0" y="0" width="540" height="58" rx="29" fill="#FBC02D"/>
    <circle cx="32" cy="29" r="11" fill="#15191f"/>
    <text x="55" y="40" fill="#15191f" font-weight="900" font-size="22" letter-spacing="4">SKLADOM · IHNEĎ K ODBERU</text>
  </g>

  <!-- Main headline -->
  <text x="70"  y="430" fill="#15191f" font-weight="900" font-size="120" letter-spacing="-3">Odkvapový systém</text>
  <text x="70"  y="570" fill="#EE1C23" font-weight="900" font-size="170" letter-spacing="-5">EUROMAT</text>

  <!-- Sub line -->
  <text x="70"  y="680" fill="#4a5560" font-weight="600" font-size="40">Kompletný pozinkovaný + farebný systém pre rodinné domy.</text>
  <text x="70"  y="730" fill="#4a5560" font-weight="600" font-size="40">Dovoz po okolí Partizánskeho zdarma.</text>

  <!-- ===== SIDE (right 42%) — Modulové krytiny ===== -->
  <rect x="1160" y="140" width="840" height="680" fill="url(#blueGrad)"/>

  <text x="1210" y="240" fill="#FBC02D" font-weight="800" font-size="30" letter-spacing="7">AJ NA MIERU</text>

  <text x="1210" y="350" fill="#ffffff" font-weight="900" font-size="100" letter-spacing="-2">Modulové</text>
  <text x="1210" y="450" fill="#ffffff" font-weight="900" font-size="100" letter-spacing="-2">krytiny</text>

  <!-- Stock list (3 items with red check bullets) -->
  <g font-size="38" font-weight="700" fill="#ffffff">
    <g transform="translate(1210, 560)">
      <circle cx="22" cy="14" r="22" fill="#EE1C23"/>
      <text x="14" y="24" font-size="26" font-weight="900" fill="#ffffff">✓</text>
      <text x="65" y="26">Skladom 12 farieb RAL</text>
    </g>
    <g transform="translate(1210, 630)">
      <circle cx="22" cy="14" r="22" fill="#EE1C23"/>
      <text x="14" y="24" font-size="26" font-weight="900" fill="#ffffff">✓</text>
      <text x="65" y="26">Objednávka na rozmer</text>
    </g>
    <g transform="translate(1210, 700)">
      <circle cx="22" cy="14" r="22" fill="#EE1C23"/>
      <text x="14" y="24" font-size="26" font-weight="900" fill="#ffffff">✓</text>
      <text x="65" y="26">Dodanie do 5 dní</text>
    </g>
  </g>

  <!-- ===== CONTACT STRIP (bottom 180mm) ===== -->
  <rect x="0" y="820" width="2000" height="180" fill="#15191f"/>

  <!-- Phone — red circle + huge number -->
  <g transform="translate(80, 858)">
    <circle cx="50" cy="50" r="50" fill="#EE1C23"/>
    <text x="50" y="68" text-anchor="middle" font-size="52" fill="#ffffff">📞</text>
  </g>
  <text x="200" y="935" fill="#ffffff" font-weight="900" font-size="86" letter-spacing="-2">+421 915 589 009</text>

  <!-- Address (middle, bigger) -->
  <text x="990" y="880" fill="#FBC02D" font-weight="800" font-size="24" letter-spacing="5">PREVÁDZKA</text>
  <text x="990" y="922" fill="#ffffff" font-weight="900" font-size="42">Víťazná 181/10</text>
  <text x="990" y="965" fill="#ffffff" font-weight="700" font-size="36">958 04 Partizánske</text>

  <!-- Web (right, bigger + non-wrapping) -->
  <line x1="1440" y1="850" x2="1440" y2="975" stroke="rgba(255,255,255,0.18)" stroke-width="3"/>
  <text x="1960" y="908" text-anchor="end" fill="#FBC02D" font-weight="900" font-size="72" letter-spacing="-1">strechy-partizanske.sk</text>
  <text x="1960" y="950" text-anchor="end" fill="rgba(255,255,255,0.78)" font-weight="700" font-size="26" letter-spacing="5">ONLINE CENOVÁ PONUKA</text>

</svg>
