<!DOCTYPE html><html lang="sk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{margin:0}
.banner{width:1200px;height:628px;font-family:'Inter',sans-serif;overflow:hidden;position:relative;color:#fff;
 background:
 radial-gradient(circle at 50% 50%,rgba(255,255,255,.06) 0 2px,transparent 3px) 0 0/24px 24px,
 radial-gradient(circle at 50% 50%,rgba(0,0,0,.50) 0 3px,transparent 4px) 12px 12px/24px 24px,
 linear-gradient(125deg,#5f656b,#2b2f34)}
.banner::before{content:'';position:absolute;inset:0;background:linear-gradient(100deg,rgba(20,22,25,.92) 38%,rgba(20,22,25,.30) 70%,transparent)}
.inner{position:relative;height:100%;padding:54px 56px 46px;display:flex;flex-direction:column}
.brand{font-size:17px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#e6b53f}
.brand::after{content:'';display:inline-block;width:46px;height:3px;background:#d39a17;margin-left:14px;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;align-self:flex-start;background:rgba(47,125,79,.22);border:1.5px solid #57b07d;color:#9fe3bb;font-weight:800;font-size:15px;padding:7px 16px;border-radius:30px}
.pill::before{content:'';width:10px;height:10px;border-radius:50%;background:#57b07d}
h1{font-size:64px;font-weight:900;line-height:1.0;letter-spacing:-1.2px;margin-top:18px;text-shadow:0 3px 12px rgba(0,0,0,.5)}
h1 .hi{color:#e6b53f}
.sub{font-size:21px;font-weight:600;color:#d6dade;line-height:1.32;margin-top:16px;max-width:600px;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.cta{margin-top:auto;display:flex;align-items:center;gap:22px}
.btn{background:#d39a17;color:#1c2127;font-size:21px;font-weight:900;padding:17px 30px;border-radius:11px;box-shadow:0 8px 20px -6px rgba(211,154,23,.6)}
.contact{font-size:15px;font-weight:700;color:#c3c8cd;line-height:1.5}.contact b{color:#fff}
.badge{position:absolute;top:50px;right:54px;background:#d39a17;color:#1c2127;font-weight:900;font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px;border-radius:8px;transform:rotate(3deg)}
</style></head><body>
<div class="banner"><div class="badge">Ochrana proti kunám</div>
 <div class="inner">
  <div class="brand">Strechy Partizánske</div>
  <div class="pill">Skladom v Partizánskom</div>
  <h1>Kuny ti ničia <span class="hi">strechu?</span></h1>
  <p class="sub">Perforovaný plech — pevná ochranná mriežka proti kunám. Zabráň škodám na izolácii, kabeláži aj odkvapoch.</p>
  <div class="cta"><span class="btn">Perforovaný plech skladom →</span>
   <span class="contact"><b>strechy-partizanske.sk</b><br>📞 +421 915 589 009</span></div>
 </div>
</div></body></html>
